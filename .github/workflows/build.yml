# HCG Executable Maker — continuous integration and releases.
#
# Every push to main or a feature/** branch, and every pull request:
#   1. test     — build + full test suite (incl. real end-to-end builds) on Linux, macOS and Windows.
#   2. package  — HCG Executable Maker packages ITSELF on each real OS (tools/self-package/self-package.cs):
#                 macOS → .dmg + .app.zip (arm64, x64) · Windows → Setup.exe installer + .zip (x64, arm64)
#                 Linux → portable .zip (preview). Results are uploaded as workflow artifacts (14 days).
#                 (main, tags and manual runs only.)
#   windows-installer — every push: HCG builds its own Setup.exe on Windows with Inno Setup, then
#                 tools/installer-test/Test-Installer.ps1 installs it (current user), checks files, shortcuts and the
#                 uninstall registration, launches the app, uninstalls it and confirms cleanup.
#   android     — Mobile Build Studio's engine builds tests/Fixtures/HelloAndroid with the project's Gradle wrapper on a
#                 runner with the Android SDK: debug APK, unsigned release APK, release APK signed with HCG's local
#                 debug key, App Bundle, and AAB → universal APK with bundletool; each verified (static + apksigner).
#   ios         — on macOS with Xcode: Simulator build, unsigned archive, and the expected refusals (IPA without
#                 code-signing identities; signed archive without a development team). No certificates are configured
#                 in CI and nothing is uploaded anywhere. Mobile outputs are workflow artifacts (7 days).
#   swift-macos — on macOS with Xcode: the REAL New Build wizard (tools/ui-driver, Avalonia headless) imports the pinned
#                 Oslo-Sprint repository as a folder and as a ZIP, evaluates Package.swift after trust, and builds
#                 Distil.app (+ ZIP, DMG), Relay.app (universal, + ZIP) and the relay-runner CLI; the apps are then
#                 verified independently (codesign, plutil, lipo), launched and screenshotted.
#   port-ios / port-android — Porting Studio (tools/ui-driver drives the real page): macOS SwiftUI sources are ported to
#                 iOS, compiled and launched in the iOS Simulator; a Linux C/CMake program is ported to Android, compiled
#                 with the NDK and launched on an emulator. Oslo-Sprint's Relay/Distil and a GTK app are assessed as
#                 blocked with specific blockers. Nothing is signed for distribution or uploaded.
# Pushing a tag like v0.1.0:
#   3. release  — creates a GitHub *pre-release* with those files and SHA256SUMS.txt.
#                 Nothing is published unless a v* tag is pushed. Artifacts are unsigned (signing: M0.4).

name: Build & Release

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # CI infrastructure installs the tool; HCG itself never installs toolchains.
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          (Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe").VersionInfo.ProductVersion
          "HCG_INSTALLER_TESTS=1" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build HCG.ExecutableMaker.slnx -c Release

      - name: Test (unit + end-to-end)
        run: dotnet test HCG.ExecutableMaker.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 14

  package:
    name: Package (${{ matrix.name }})
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            targets: osx-arm64,osx-x64
          - name: windows
            os: windows-latest
            targets: win-x64,win-arm64
            extra: --installer
          - name: linux
            os: ubuntu-latest
            targets: linux-x64,linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
            version="${base}-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Packaging version $version"

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Self-package with HCG Executable Maker
        shell: bash
        run: >
          dotnet run --no-cache tools/self-package/self-package.cs --
          . "${{ runner.temp }}/selfpack"
          --targets "${{ matrix.targets }}"
          --version "$VERSION"
          --dist "${{ runner.temp }}/dist"
          ${{ matrix.extra }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: hcg-executable-maker-${{ matrix.name }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows installer (build, install, launch, uninstall)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          (Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe").VersionInfo.ProductVersion

      - name: HCG Executable Maker builds its own Setup.exe
        shell: bash
        run: >
          dotnet run --no-cache tools/self-package/self-package.cs --
          . "${{ runner.temp }}/selfpack" --targets win-x64 --version 0.2.0 --dist "${{ runner.temp }}/dist" --installer

      - name: Install, verify, launch, uninstall, confirm cleanup
        shell: pwsh
        run: >
          ./tools/installer-test/Test-Installer.ps1
          -Setup "${{ runner.temp }}/dist/HCG-Executable-Maker-0.2.0-win-x64-Setup.exe"
          -AppName "HCG Executable Maker" -ExeName HCGExecutableMaker.exe -Version 0.2.0

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hcg-executable-maker-windows-setup
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Mobile — Android (real Gradle builds)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/mobile-out
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Toolchain (JDK 17, Android SDK from the runner image, bundletool)
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms"
          # CI infrastructure downloads Google's bundletool; HCG itself never downloads tools.
          curl -fsSL -o "$RUNNER_TEMP/bundletool-all-1.18.1.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          sha256sum "$RUNNER_TEMP/bundletool-all-1.18.1.jar"
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool-all-1.18.1.jar" >> "$GITHUB_ENV"

      - name: Debug APK
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloAndroid "$OUT" --output android-debug-apk --trust

      - name: Release APK (unsigned — no signing configured in the project)
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloAndroid "$OUT" --output android-release-apk --signing unsigned --trust

      - name: Release APK signed with HCG's local debug key
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloAndroid "$OUT/debug-key" --output android-release-apk --signing debug-key --trust

      - name: Android App Bundle (.aab)
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloAndroid "$OUT" --output android-aab --trust

      - name: AAB → universal APK (bundletool), from the project
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloAndroid "$OUT" --output aab-to-apk --trust

      - name: AAB → universal APK (bundletool), from an imported .aab artifact
        run: |
          aab=$(find "$OUT" -path '*android-aab*' -name '*.aab' | head -1)
          echo "Input: $aab"
          dotnet run --no-cache tools/mobile-build/mobile-build.cs -- "$aab" "$OUT/from-artifact" --output aab-to-apk --trust

      - name: Upload Android outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-fixture-outputs
          path: ${{ github.workspace }}/mobile-out
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: Mobile — iOS (real Xcode builds)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/mobile-out
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: iOS Simulator build
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloIOS "$OUT" --output ios-simulator --trust

      - name: Unsigned device archive (.xcarchive, inspection only)
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloIOS "$OUT" --output ios-archive --signing unsigned --trust

      # CI has no Apple certificates, so HCG refuses the IPA before archiving (capability gate). The later refusal —
      # inspecting an unsigned archive and declining to export it — is covered by MobileBuildServiceTests.
      - name: IPA is refused without code-signing identities
        run: >
          dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloIOS "$OUT/refused" --output ios-ipa
          --trust --expect-failure "No code-signing identities were found"

      - name: Signed archive without a development team fails honestly (no certificates in CI)
        run: >
          dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloIOS "$OUT/refused" --output ios-archive
          --trust --expect-failure "failed with exit code"

      - name: Upload iOS outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-fixture-outputs
          path: ${{ github.workspace }}/mobile-out
          if-no-files-found: warn
          retention-days: 7

  swift-macos:
    name: Swift — macOS apps through the New Build wizard (Distil, Relay)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      OUT: ${{ github.workspace }}/swift-out
      # Pinned public reference repository (two SwiftPM packages; GUI products are declared under #if os(macOS)).
      OSLO_REPO: https://github.com/F1r3srp3nt/Oslo-Sprint.git
      OSLO_COMMIT: 45431255bcc50c0e48c553c1f522ed67adf7e954
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Toolchain (Swift, SDK, developer directory)
        run: |
          sw_vers
          xcode-select -p
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Reference projects (folder + ZIP with a wrapping folder)
        run: |
          mkdir -p "$OUT/screens"
          git clone --quiet "$OSLO_REPO" "$OUT/Oslo-Sprint"
          git -C "$OUT/Oslo-Sprint" checkout --quiet "$OSLO_COMMIT"
          git -C "$OUT/Oslo-Sprint" archive --format=zip --prefix=Oslo-Sprint-main/ -o "$OUT/Oslo-Sprint-main.zip" HEAD
          unzip -l "$OUT/Oslo-Sprint-main.zip" | grep Package.swift

      - name: Build the UI driver (real app views, headless)
        run: dotnet build tools/ui-driver -c Release

      - name: Distil.app — folder import, package distil/, product TokenLab (app + ZIP + DMG)
        run: >
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source "$OUT/Oslo-Sprint" --package distil
          --product TokenLab --name Distil --bundle-id dev.tokenlab.prototype --version 0.4.0 --build-number 4
          --category public.app-category.developer-tools --arch arm64 --formats app,zip,dmg
          --expect-products TokenLab --expect-libraries TokenLabCore --expect-tests TokenLabCoreTests
          --output "$OUT/distil" --screenshots "$OUT/screens" --prefix distil

      - name: Relay.app — ZIP import (wrapper folder), package relay/, product Relay, universal (app + ZIP)
        run: >
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source "$OUT/Oslo-Sprint-main.zip" --package Oslo-Sprint-main/relay
          --product Relay --name Relay --bundle-id com.oslosprint.relay --version 0.1.0 --build-number 1 --arch universal --formats app,zip
          "--usage" "NSMicrophoneUsageDescription=Relay records only while you hold the push-to-talk button, and sends that recording to ElevenLabs for transcription."
          --expect-products "Relay,relay-runner" --expect-libraries "RelayCore,RelayAdapters" --expect-tests "RelayAdaptersTests,RelayCoreTests"
          --output "$OUT/relay" --screenshots "$OUT/screens" --prefix relay

      - name: relay-runner — command-line product (folder + ZIP)
        run: >
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source "$OUT/Oslo-Sprint-main.zip" --package Oslo-Sprint-main/relay
          --product relay-runner --name relay-runner --bundle-id com.oslosprint.relay-runner --version 0.1.0 --arch arm64 --formats folder,zip
          --output "$OUT/runner" --screenshots "$OUT/screens" --prefix runner

      - name: Launch and inspect the built apps
        run: |
          distil="$(find "$OUT/distil/artifacts" -maxdepth 2 -name Distil.app -type d | head -1)"
          relay="$(find "$OUT/relay/artifacts" -maxdepth 2 -name Relay.app -type d | head -1)"
          tools/ui-driver/verify-macos-app.sh "$distil" "$OUT/screens/launch-distil.png" arm64
          tools/ui-driver/verify-macos-app.sh "$relay" "$OUT/screens/launch-relay.png" "arm64 x86_64"
          # The app ZIP as a recipient gets it.
          mkdir -p "$OUT/unzipped" && ditto -x -k "$(find "$OUT/relay/artifacts" -name '*.app.zip' | head -1)" "$OUT/unzipped"
          tools/ui-driver/verify-macos-app.sh "$OUT/unzipped/Relay.app" "$OUT/screens/launch-relay-from-zip.png" "arm64 x86_64"
          # The DMG: mount read-only, verify the app inside and the Applications link.
          dmg="$(find "$OUT/distil/artifacts" -name '*.dmg' | head -1)"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          ls -la "$mnt"
          codesign --verify --strict --deep --verbose=2 "$mnt/Distil.app"
          test -L "$mnt/Applications"
          hdiutil detach "$mnt"

      - name: Run the command-line product
        run: |
          runner="$(find "$OUT/runner/artifacts" -maxdepth 3 -type f -name relay-runner -perm -u+x | head -1)"
          lipo -archs "$runner"
          "$runner" help
          "$runner" export-procedure | head -c 400; echo
          mkdir -p "$OUT/runner-unzipped" && unzip -q "$(find "$OUT/runner/artifacts" -name '*.zip' | head -1)" -d "$OUT/runner-unzipped"
          "$(find "$OUT/runner-unzipped" -type f -name relay-runner | head -1)" help | head -3

      - name: Screenshots (JPEG, base64 in the log)
        if: always()
        run: |
          shopt -s nullglob
          for f in "$OUT"/screens/*.png; do
            j="${f%.png}.jpg"
            sips -s format jpeg -s formatOptions 60 -Z 1400 "$f" --out "$j" >/dev/null
            echo "=====BEGIN-IMG $(basename "$j")====="
            base64 -i "$j" | tr -d '\n'; echo
            echo "=====END-IMG====="
          done

      - name: Upload Swift outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-macos-outputs
          path: |
            ${{ github.workspace }}/swift-out/screens
            ${{ github.workspace }}/swift-out/*/artifacts
            ${{ github.workspace }}/swift-out/*/*.txt
            ${{ github.workspace }}/swift-out/*/*.json
          if-no-files-found: warn
          retention-days: 7

  port-ios:
    name: Porting — macOS source → iOS app, compiled and launched in the Simulator
    needs: test
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      OUT: ${{ github.workspace }}/port-ios-out
      OSLO_REPO: https://github.com/F1r3srp3nt/Oslo-Sprint.git
      OSLO_COMMIT: 45431255bcc50c0e48c553c1f522ed67adf7e954
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Toolchain
        run: |
          mkdir -p "$OUT/screens"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: The sources are real Mac apps (build them for macOS first)
        run: |
          (cd tests/Fixtures/TallyPackage && swift build --scratch-path "$OUT/tally-mac" 2>&1 | tail -3)
          xcodebuild -project tests/Fixtures/HelloMac/HelloMac.xcodeproj -scheme HelloMac -configuration Release -derivedDataPath "$OUT/hellomac-mac" build -quiet
          echo "Both fixtures build as macOS apps."

      - name: Build the UI driver
        run: dotnet build tools/ui-driver -c Release

      - name: Swift package app (TallyPackage) → iOS — assess, generate, compile, launch in Simulator
        run: >
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source tests/Fixtures/TallyPackage --port "swiftpm::TallyApp"
          --name Tally --bundle-id com.hakmicapital.tally "--usage" "NSMicrophoneUsageDescription=Tally shows whether the microphone may be used for voice notes."
          --expect-capability GenerateTarget --compile --expect-compile Passed --launch --expect-launch Passed
          --output "$OUT/tally" --screenshots "$OUT/screens" --prefix tally-ios --window-height 3600

      - name: macOS Xcode project (HelloMac) → iOS — assess, generate, compile, launch in Simulator
        run: >
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source tests/Fixtures/HelloMac --port "xcode:HelloMac.xcodeproj"
          --name "Hello HCG" --bundle-id com.hakmicapital.hellomac
          --expect-capability GenerateTarget --compile --expect-compile Passed --launch --expect-launch Passed
          --output "$OUT/hellomac" --screenshots "$OUT/screens" --prefix hellomac-ios --window-height 3600

      - name: Oslo-Sprint (real apps) — Relay and Distil are assessed as blocked, with specific blockers; Relay draft
        run: |
          git clone --quiet "$OSLO_REPO" "$OUT/Oslo-Sprint" && git -C "$OUT/Oslo-Sprint" checkout --quiet "$OSLO_COMMIT"
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source "$OUT/Oslo-Sprint" --port "swiftpm:relay:RelayApp" \
            --name Relay --bundle-id com.oslosprint.relay "--usage" "NSMicrophoneUsageDescription=Push to talk." --draft \
            --expect-capability BlockedNeedsPorting --compile --expect-compile NotPerformed \
            --output "$OUT/relay" --screenshots "$OUT/screens" --prefix relay-ios --window-height 3600
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source "$OUT/Oslo-Sprint" --port "swiftpm:distil:TokenLabApp" \
            --assess-only --expect-capability BlockedNeedsPorting --output "$OUT/distil" --screenshots "$OUT/screens" --prefix distil-ios --window-height 3600
          # The draft really does not compile for iOS, and fails only on HCG's explicit blocker marker.
          relay_out="$(find "$OUT/relay/ports" -maxdepth 1 -type d -name '*-ios-port-*' | head -1)"
          set +e
          xcodebuild -project "$relay_out/relay/iOS/Relay.xcodeproj" -scheme Relay -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$OUT/relay-dd" build CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:" | sort -u | head -10
          set -e

      - name: Screenshots (JPEG, base64 in the log)
        if: always()
        run: |
          shopt -s nullglob
          for f in "$OUT"/screens/*.png "$OUT"/*/ports/*/HCG-PORT/launch-*.png; do
            j="$OUT/screens/$(basename "$(dirname "$(dirname "$f")")")-$(basename "${f%.png}").jpg"
            case "$f" in "$OUT"/screens/*) j="${f%.png}.jpg" ;; esac
            sips -s format jpeg -s formatOptions 55 -Z 1600 "$f" --out "$j" >/dev/null
            echo "=====BEGIN-IMG $(basename "$j")====="
            base64 -i "$j" | tr -d '\n'; echo
            echo "=====END-IMG====="
          done

      - name: Upload ports, reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: port-ios-outputs
          path: |
            ${{ github.workspace }}/port-ios-out/screens
            ${{ github.workspace }}/port-ios-out/*/ports/*/HCG-PORT
            ${{ github.workspace }}/port-ios-out/*/*.txt
          if-no-files-found: warn
          retention-days: 7

  port-android:
    name: Porting — Linux C program → Android app, compiled with the NDK and launched on an emulator
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OUT: ${{ github.workspace }}/port-android-out
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Toolchain (JDK 17, Android SDK + NDK + CMake from the runner image)
        run: |
          mkdir -p "$OUT/screens"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$sdk/ndk" "$sdk/cmake" "$sdk/platform-tools"

      - name: The source is a real Linux program (build and run it natively)
        run: |
          cmake -S tests/Fixtures/LinuxPrimes -B "$OUT/native" -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$OUT/native"
          printf "97\n100\n" | "$OUT/native/primes" -n 100000 -l -i

      - name: Build the UI driver
        run: dotnet build tools/ui-driver -c Release

      - name: GTK program is assessed as blocked (specific blockers), draft generated
        run: >
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source tests/Fixtures/LinuxGtkHello --port "cmake::gtk-hello"
          --name "GTK Hello" --bundle-id com.hakmicapital.gtkhello --draft --expect-capability BlockedNeedsPorting
          --output "$OUT/gtk" --screenshots "$OUT/screens" --prefix gtk-android --window-height 3600

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Port LinuxPrimes → Android, compile (Gradle + NDK) and launch on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: tools/ui-driver/ci-port-android.sh

      - name: Screenshots (JPEG, base64 in the log)
        if: always()
        run: |
          shopt -s nullglob
          python3 -m pip install --quiet pillow
          for f in "$OUT"/screens/*.png "$OUT"/*/ports/*/HCG-PORT/launch-*.png; do
            j="$OUT/screens/$(basename "${f%.png}").jpg"
            python3 -c "import sys; from PIL import Image; im=Image.open(sys.argv[1]).convert('RGB'); im.thumbnail((1600,1600)); im.save(sys.argv[2], quality=55)" "$f" "$j"
            echo "=====BEGIN-IMG $(basename "$j")====="
            base64 -w0 "$j"; echo
            echo "=====END-IMG====="
          done

      - name: Upload ports, reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: port-android-outputs
          path: |
            ${{ github.workspace }}/port-android-out/screens
            ${{ github.workspace }}/port-android-out/*/ports/*/HCG-PORT
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hcg-executable-maker-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          HCG Executable Maker ${GITHUB_REF_NAME#v} — built and packaged by HCG Executable Maker itself on GitHub's macOS, Windows and Linux runners.

          | Platform | Download |
          |---|---|
          | macOS (Apple Silicon) | \`*-osx-arm64.dmg\` (or \`.app.zip\`) |
          | macOS (Intel) | \`*-osx-x64.dmg\` (or \`.app.zip\`) |
          | Windows x64 / ARM64 (installer) | \`*-win-x64-Setup.exe\` / \`*-win-arm64-Setup.exe\` |
          | Windows x64 / ARM64 (portable) | \`*-win-x64.zip\` / \`*-win-arm64.zip\` |
          | Linux (preview) | \`*-linux-x64.zip\` / \`*-linux-arm64.zip\` |

          **Unsigned pre-release** — not code-signed or notarized (planned for M0.4).
          - macOS first launch: \`xattr -cr "/Applications/HCG Executable Maker.app"\`, then right-click → Open.
          - Windows: SmartScreen → More info → Run anyway.

          Install the .NET 10 SDK to build projects with the app. See docs/TESTING.md. Verify downloads with SHA256SUMS.txt.
          EOF
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "HCG Executable Maker ${GITHUB_REF_NAME#v}" --notes-file notes.md --prerelease --verify-tag
          fi
