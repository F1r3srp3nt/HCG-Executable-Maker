# HCG Executable Maker — continuous integration and releases.
#
# Every push to main or a feature/** branch, and every pull request:
#   1. test     — build + full test suite (incl. real end-to-end builds) on Linux, macOS and Windows.
#   2. package  — HCG Executable Maker packages ITSELF on each real OS (tools/self-package/self-package.cs):
#                 macOS → .dmg + .app.zip (arm64, x64) · Windows → Setup.exe installer + .zip (x64, arm64)
#                 Linux → portable .zip (preview). Results are uploaded as workflow artifacts (14 days).
#                 (main, tags and manual runs only.)
#   windows-installer — every push: HCG builds its own Setup.exe on Windows with Inno Setup, then
#                 tools/installer-test/Test-Installer.ps1 installs it (current user), checks files, shortcuts and the
#                 uninstall registration, launches the app, uninstalls it and confirms cleanup.
#   android     — Mobile Build Studio's engine builds tests/Fixtures/HelloAndroid with the project's Gradle wrapper on a
#                 runner with the Android SDK: debug APK, unsigned release APK, release APK signed with HCG's local
#                 debug key, App Bundle, and AAB → universal APK with bundletool; each verified (static + apksigner).
#   ios         — on macOS with Xcode: Simulator build, unsigned archive, and the expected refusals (IPA without
#                 code-signing identities; signed archive without a development team). No certificates are configured
#                 in CI and nothing is uploaded anywhere. Mobile outputs are workflow artifacts (7 days).
#   swift-macos — on macOS with Xcode: the REAL New Build wizard (tools/ui-driver, Avalonia headless) imports the pinned
#                 Oslo-Sprint repository as a folder and as a ZIP, evaluates Package.swift after trust, and builds
#                 Distil.app (+ ZIP, DMG), Relay.app (universal, + ZIP) and the relay-runner CLI; the apps are then
#                 verified independently (codesign, plutil, lipo), launched and screenshotted.
# Pushing a tag like v0.1.0:
#   3. release  — creates a GitHub *pre-release* with those files and SHA256SUMS.txt.
#                 Nothing is published unless a v* tag is pushed. Artifacts are unsigned (signing: M0.4).

name: Build & Release

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # CI infrastructure installs the tool; HCG itself never installs toolchains.
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          (Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe").VersionInfo.ProductVersion
          "HCG_INSTALLER_TESTS=1" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build HCG.ExecutableMaker.slnx -c Release

      - name: Test (unit + end-to-end)
        run: dotnet test HCG.ExecutableMaker.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 14

  package:
    name: Package (${{ matrix.name }})
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            targets: osx-arm64,osx-x64
          - name: windows
            os: windows-latest
            targets: win-x64,win-arm64
            extra: --installer
          - name: linux
            os: ubuntu-latest
            targets: linux-x64,linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
            version="${base}-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Packaging version $version"

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Self-package with HCG Executable Maker
        shell: bash
        run: >
          dotnet run --no-cache tools/self-package/self-package.cs --
          . "${{ runner.temp }}/selfpack"
          --targets "${{ matrix.targets }}"
          --version "$VERSION"
          --dist "${{ runner.temp }}/dist"
          ${{ matrix.extra }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: hcg-executable-maker-${{ matrix.name }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows installer (build, install, launch, uninstall)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          (Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe").VersionInfo.ProductVersion

      - name: HCG Executable Maker builds its own Setup.exe
        shell: bash
        run: >
          dotnet run --no-cache tools/self-package/self-package.cs --
          . "${{ runner.temp }}/selfpack" --targets win-x64 --version 0.3.0 --dist "${{ runner.temp }}/dist" --installer

      - name: Install, verify, launch, uninstall, confirm cleanup
        shell: pwsh
        run: >
          ./tools/installer-test/Test-Installer.ps1
          -Setup "${{ runner.temp }}/dist/HCG-Executable-Maker-0.3.0-win-x64-Setup.exe"
          -AppName "HCG Executable Maker" -ExeName HCGExecutableMaker.exe -Version 0.3.0

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hcg-executable-maker-windows-setup
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Mobile — Android (real Gradle builds)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/mobile-out
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Toolchain (JDK 17, Android SDK from the runner image, bundletool)
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms"
          # CI infrastructure downloads Google's bundletool; HCG itself never downloads tools.
          curl -fsSL -o "$RUNNER_TEMP/bundletool-all-1.18.1.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          sha256sum "$RUNNER_TEMP/bundletool-all-1.18.1.jar"
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool-all-1.18.1.jar" >> "$GITHUB_ENV"

      - name: Debug APK
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloAndroid "$OUT" --output android-debug-apk --trust

      - name: Finder-style launch — no JAVA_HOME, ANDROID_HOME or shell PATH; HCG finds the JDK and SDK itself
        run: |
          set -o pipefail
          dotnet build src/HCG.ExecutableMaker.App -c Release -v q
          bare() { env -i HOME="$HOME" PATH=/usr/bin:/bin DOTNET_ROOT="$DOTNET_ROOT" BUNDLETOOL_JAR="$BUNDLETOOL_JAR" HCG_EXECUTABLE_MAKER_HOME="$RUNNER_TEMP/hcg-bare" "$(command -v dotnet)" "$@"; }
          bare src/HCG.ExecutableMaker.App/bin/Release/net10.0/HCGExecutableMaker.dll --toolchain-report | tee "$OUT/toolchains-bare-env.txt"
          grep -q "^JDK selected: /" "$OUT/toolchains-bare-env.txt"
          grep -q "^Android SDK: /" "$OUT/toolchains-bare-env.txt"
          bare run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloAndroid "$OUT/bare-env" --output android-debug-apk --trust

      - name: Release APK (unsigned — no signing configured in the project)
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloAndroid "$OUT" --output android-release-apk --signing unsigned --trust

      - name: Release APK signed with HCG's local debug key
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloAndroid "$OUT/debug-key" --output android-release-apk --signing debug-key --trust

      - name: Android App Bundle (.aab)
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloAndroid "$OUT" --output android-aab --trust

      - name: AAB → universal APK (bundletool), from the project
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloAndroid "$OUT" --output aab-to-apk --trust

      - name: AAB → universal APK (bundletool), from an imported .aab artifact
        run: |
          aab=$(find "$OUT" -path '*android-aab*' -name '*.aab' | head -1)
          echo "Input: $aab"
          dotnet run --no-cache tools/mobile-build/mobile-build.cs -- "$aab" "$OUT/from-artifact" --output aab-to-apk --trust

      - name: Upload Android outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-fixture-outputs
          path: ${{ github.workspace }}/mobile-out
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: Mobile — iOS (real Xcode builds)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/mobile-out
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: iOS Simulator build
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloIOS "$OUT" --output ios-simulator --trust

      - name: Unsigned device archive (.xcarchive, inspection only)
        run: dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloIOS "$OUT" --output ios-archive --signing unsigned --trust

      # CI has no Apple certificates, so HCG refuses the IPA before archiving (capability gate). The later refusal —
      # inspecting an unsigned archive and declining to export it — is covered by MobileBuildServiceTests.
      - name: IPA is refused without code-signing identities
        run: >
          dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloIOS "$OUT/refused" --output ios-ipa
          --trust --expect-failure "No code-signing identities were found"

      - name: Signed archive without a development team fails honestly (no certificates in CI)
        run: >
          dotnet run --no-cache tools/mobile-build/mobile-build.cs -- tests/Fixtures/HelloIOS "$OUT/refused" --output ios-archive
          --trust --expect-failure "failed with exit code"

      - name: Upload iOS outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-fixture-outputs
          path: ${{ github.workspace }}/mobile-out
          if-no-files-found: warn
          retention-days: 7

  swift-macos:
    name: Swift — macOS apps through the New Build wizard (Distil, Relay, parent repo, resources)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      OUT: ${{ github.workspace }}/swift-out
      OSLO_REPO: https://github.com/F1r3srp3nt/Oslo-Sprint.git
      OSLO_COMMIT: b5d86974e7c789523b46df8a8184f768c06b212c
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Toolchain (Swift, SDK, developer directory, XCTest); pick an Xcode for HCG that is NOT the system one
        run: |
          sw_vers
          xcode-select -p
          sys="$(cd "$(xcode-select -p)" && pwd -P)"
          echo "SYSTEM_DEVDIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          ls -d /Applications/Xcode*.app
          alt=""
          for a in /Applications/Xcode_*.app; do [ "$(cd "$a/Contents/Developer" && pwd -P)" != "$sys" ] && alt="$a"; done
          echo "HCG_XCODE=${alt:-$(dirname "$(dirname "$sys")")}" >> "$GITHUB_ENV"
          echo "System developer directory: $sys · Xcode selected for HCG only: ${alt:-same as system (no other Xcode installed)}"
          swift --version
          xcrun --sdk macosx --show-sdk-version
          ls "$(xcrun --sdk macosx --show-sdk-platform-path)/Developer/Library/Frameworks" | grep -i xctest || echo "XCTest not found (only affects tests)"

      - name: Reference projects, built first with their own scripts (realistic working copies)
        run: |
          mkdir -p "$OUT/screens"
          git clone --quiet "$OSLO_REPO" "$OUT/Oslo-Sprint"
          git -C "$OUT/Oslo-Sprint" checkout --quiet "$OSLO_COMMIT"
          git -C "$OUT/Oslo-Sprint" archive --format=zip --prefix=Oslo-Sprint-main/ -o "$OUT/Oslo-Sprint-main.zip" HEAD
          bash "$OUT/Oslo-Sprint/distil/scripts/build-macos.sh"
          bash "$OUT/Oslo-Sprint/relay/scripts/build-app.sh"
          ls -d "$OUT/Oslo-Sprint/distil/.build" "$OUT/Oslo-Sprint/distil/dist/Distil.app" "$OUT/Oslo-Sprint/relay/build/Relay.app"

      - name: Build HCG and the UI driver (real app views, headless)
        run: |
          dotnet build tools/ui-driver -c Release
          dotnet src/HCG.ExecutableMaker.App/bin/Release/net10.0/HCGExecutableMaker.dll --version

      - name: Toolchain report — Terminal launch vs Finder-style launch (no shell environment)
        run: |
          set -o pipefail
          app=src/HCG.ExecutableMaker.App/bin/Release/net10.0/HCGExecutableMaker.dll
          dotnet "$app" --toolchain-report | tee "$OUT/toolchains-terminal.txt"
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin DOTNET_ROOT="$DOTNET_ROOT" HCG_EXECUTABLE_MAKER_HOME="$RUNNER_TEMP/hcg-finder" \
            "$(command -v dotnet)" "$app" --toolchain-report | tee "$OUT/toolchains-finder.txt"
          grep -q "^JDK selected: /" "$OUT/toolchains-finder.txt"
          grep -q "^Android SDK: /" "$OUT/toolchains-finder.txt"
          grep -q "^Xcode: Ready" "$OUT/toolchains-finder.txt"

      - name: Command Line Tools selected while Xcode is installed (disposable runner only) — diagnosed, then restored
        run: |
          set -o pipefail
          if [ ! -d /Library/Developer/CommandLineTools ]; then echo "No Command Line Tools on this runner image; scenario not reproducible here"; exit 0; fi
          app=src/HCG.ExecutableMaker.App/bin/Release/net10.0/HCGExecutableMaker.dll
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          env -u DEVELOPER_DIR HCG_EXECUTABLE_MAKER_HOME="$RUNNER_TEMP/hcg-clt" dotnet "$app" --toolchain-report | tee "$OUT/toolchains-clt.txt" || true
          sudo xcode-select --switch "$SYSTEM_DEVDIR"
          xcode-select -p
          grep -q "^Xcode: InstalledNotSelected" "$OUT/toolchains-clt.txt"
          grep -q "\[Apple mobile\] iOS SDK: SetupRequired" "$OUT/toolchains-clt.txt"
          grep -q "Select Xcode .* for HCG" "$OUT/toolchains-clt.txt"

      - name: Distil — import distil/ alone; identity comes from its own script (not passed in)
        run: >
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source "$OUT/Oslo-Sprint/distil" --package ""
          --product Distil --expect-name Distil --expect-bundle-id dev.tokenlab.prototype --expect-version "0.5.0 (5)"
          --arch arm64 --formats app,zip,dmg,pkg --expect-products Distil --expect-libraries TokenLabCore --expect-tests TokenLabCoreTests
          --select-xcode "$HCG_XCODE" --expect-xcode-state Ready --test-install launch
          --output "$OUT/distil" --screenshots "$OUT/screens" --prefix distil

      - name: Xcode selection applied to HCG only; the build used it; the system setting is unchanged
        run: |
          echo "xcode-select -p now: $(xcode-select -p) (before: $SYSTEM_DEVDIR)"
          [ "$(xcode-select -p)" = "$SYSTEM_DEVDIR" ]
          used="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ToolchainVersions"]["developer-dir"])' "$OUT/distil/distil-build.json")"
          echo "Developer directory recorded by the build: $used"
          [ "$used" = "$HCG_XCODE/Contents/Developer" ]
          exe="$(find "$OUT/distil/artifacts" -path '*Distil.app/Contents/MacOS/Distil' -type f | head -1)"
          echo "SDK recorded in the executable:"; vtool -show-build "$exe" | grep -i sdk
          echo "SDK of the selected Xcode: $(DEVELOPER_DIR="$HCG_XCODE/Contents/Developer" xcrun --sdk macosx --show-sdk-version)"
          vtool -show-build "$exe" | grep -qi "sdk $(DEVELOPER_DIR="$HCG_XCODE/Contents/Developer" xcrun --sdk macosx --show-sdk-version)"

      - name: Installer package — inspect, install on this disposable runner, launch, remove
        run: |
          pkg="$(find "$OUT/distil/artifacts" -maxdepth 3 -name '*.pkg' | head -1)"
          app="$(find "$OUT/distil/artifacts" -maxdepth 3 -name Distil.app -type d | head -1)"
          pkgutil --check-signature "$pkg" || true
          pkgutil --payload-files "$pkg" | head -20
          sudo installer -pkg "$pkg" -target /
          diff -r "$app" /Applications/Distil.app && echo "Installed app is identical to the built app"
          codesign --verify --strict --deep --verbose=2 /Applications/Distil.app
          tools/ui-driver/verify-macos-app.sh /Applications/Distil.app "$OUT/screens/launch-installed-distil.png" arm64
          sudo rm -rf /Applications/Distil.app
          sudo pkgutil --forget dev.tokenlab.prototype

      - name: Relay — import relay/ alone; microphone text comes from its own script
        run: >
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source "$OUT/Oslo-Sprint/relay" --package ""
          --product Relay --expect-bundle-id com.oslosprint.relay --expect-version "0.2.0 (2)" --arch universal --formats app,zip
          --expect-products "Relay,relay-runner" --expect-libraries "RelayAdapters,RelayCore" --expect-tests "RelayAdaptersTests,RelayCoreTests"
          --output "$OUT/relay" --screenshots "$OUT/screens" --prefix relay

      - name: Parent repository — folder import, choose distil/ then relay/ (CLI product)
        run: |
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source "$OUT/Oslo-Sprint" --package distil \
            --product Distil --expect-bundle-id dev.tokenlab.prototype --arch arm64 --formats app \
            --output "$OUT/parent-distil" --screenshots "$OUT/screens" --prefix parent-distil
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source "$OUT/Oslo-Sprint" --package relay \
            --product relay-runner --name relay-runner --bundle-id com.oslosprint.relay-runner --arch arm64 --formats folder,zip \
            --output "$OUT/runner" --screenshots "$OUT/screens" --prefix runner

      - name: Parent repository — GitHub-style ZIP (wrapper folder), relay/
        run: >
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source "$OUT/Oslo-Sprint-main.zip" --package Oslo-Sprint-main/relay
          --product Relay --expect-bundle-id com.oslosprint.relay --arch arm64 --formats app
          --output "$OUT/zip-relay" --screenshots "$OUT/screens" --prefix zip-relay

      - name: SwiftPM resources (library + app target) through Bundle.module
        run: >
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --source tests/Fixtures/ResourceProbe --package ""
          --product ResourceProbe --name "Resource Probe" --bundle-id com.hakmicapital.resourceprobe --arch arm64 --formats app,zip
          --output "$OUT/probe" --screenshots "$OUT/screens" --prefix probe

      - name: Launch and inspect the built apps; Info.plist parity with the projects' own scripts
        run: |
          app() { find "$1" -maxdepth 3 -name "$2" -type d | head -1; }
          distil="$(app "$OUT/distil/artifacts" Distil.app)"
          relay="$(app "$OUT/relay/artifacts" Relay.app)"
          probe="$(app "$OUT/probe/artifacts" 'Resource Probe.app')"
          tools/ui-driver/verify-macos-app.sh "$distil" "$OUT/screens/launch-distil.png" arm64
          tools/ui-driver/verify-macos-app.sh "$relay" "$OUT/screens/launch-relay.png" "arm64 x86_64"
          tools/ui-driver/verify-macos-app.sh "$(app "$OUT/parent-distil/artifacts" Distil.app)" "$OUT/screens/launch-parent-distil.png" arm64
          tools/ui-driver/verify-macos-app.sh "$(app "$OUT/zip-relay/artifacts" Relay.app)" "$OUT/screens/launch-zip-relay.png" arm64
          rm -f "$TMPDIR/hcg-resource-probe.txt"
          tools/ui-driver/verify-macos-app.sh "$probe" "$OUT/screens/launch-resource-probe.png" arm64
          echo "--- resource probe report:"; cat "$TMPDIR/hcg-resource-probe.txt"
          grep -q "^app=Banner from the app target$" "$TMPDIR/hcg-resource-probe.txt"
          grep -q "^library=Hello from ProbeKit resources$" "$TMPDIR/hcg-resource-probe.txt"
          for k in CFBundleExecutable CFBundleIdentifier CFBundleDisplayName CFBundleShortVersionString CFBundleVersion LSMinimumSystemVersion LSApplicationCategoryType NSMicrophoneUsageDescription; do
            for pair in "$distil|$OUT/Oslo-Sprint/distil/dist/Distil.app" "$relay|$OUT/Oslo-Sprint/relay/build/Relay.app"; do
              a="$(/usr/libexec/PlistBuddy -c "Print :$k" "${pair%%|*}/Contents/Info.plist" 2>/dev/null || echo '<absent>')"
              b="$(/usr/libexec/PlistBuddy -c "Print :$k" "${pair##*|}/Contents/Info.plist" 2>/dev/null || echo '<absent>')"
              [ "$a" = "$b" ] && echo "same  $k: $a" || { echo "DIFF  $k: HCG=$a script=$b"; exit 1; }
            done
          done

      - name: Run the command-line product
        run: |
          runner="$(find "$OUT/runner/artifacts" -maxdepth 3 -type f -name relay-runner -perm -u+x | head -1)"
          "$runner" help | head -3

      - name: Screenshots (JPEG, base64 in the log)
        if: always()
        run: |
          shopt -s nullglob
          for f in "$OUT"/screens/*.png; do
            j="${f%.png}.jpg"
            sips -s format jpeg -s formatOptions 60 -Z 1400 "$f" --out "$j" >/dev/null
            echo "=====BEGIN-IMG $(basename "$j")====="
            base64 -i "$j" | tr -d '\n'; echo
            echo "=====END-IMG====="
          done

      - name: Upload Swift outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-macos-outputs
          path: |
            ${{ github.workspace }}/swift-out/screens
            ${{ github.workspace }}/swift-out/*/artifacts
            ${{ github.workspace }}/swift-out/*/*.txt
            ${{ github.workspace }}/swift-out/*/*.json
          if-no-files-found: warn
          retention-days: 7

  electron-macos:
    name: Electron — Presentation Studio through the New Build wizard (arm64 .app, zip, dmg; launch; packaged-app e2e)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      OUT: ${{ github.workspace }}/electron-out
      OSLO_REPO: https://github.com/F1r3srp3nt/Oslo-Sprint.git
      # Presentation Studio after its desktop conversion (electron-builder.yml, desktop:* scripts).
      OSLO_COMMIT: 49b401699e66b7b5b66db13d19eeb6b554988b58
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Presentation Studio at a pinned commit — a clean copy (no node_modules, no release/)
        run: |
          mkdir -p "$OUT/screens" "$OUT/src"
          git clone --quiet "$OSLO_REPO" "$OUT/Oslo-Sprint"
          git -C "$OUT/Oslo-Sprint" checkout --quiet "$OSLO_COMMIT"
          git -C "$OUT/Oslo-Sprint" archive HEAD presentation-studio | tar -x -C "$OUT/src"
          ls "$OUT/src/presentation-studio"
          sw_vers; uname -m; node --version; npm --version
          python -m pip install --quiet python-pptx==1.0.2

      - name: Build HCG and the UI driver (real app views, headless)
        run: dotnet build tools/ui-driver -c Release

      - name: Toolchain report — Node.js from a Terminal launch and from a Finder-style launch (no shell environment)
        run: |
          app=src/HCG.ExecutableMaker.App/bin/Release/net10.0/HCGExecutableMaker.dll
          dotnet "$app" --toolchain-report | grep -F "[Node.js / Electron]" -A1 | tee "$OUT/node-terminal.txt"
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin DOTNET_ROOT="$DOTNET_ROOT" HCG_EXECUTABLE_MAKER_HOME="$RUNNER_TEMP/hcg-finder" \
            "$(command -v dotnet)" "$app" --toolchain-report | grep -F "[Node.js / Electron]" -A1 | tee "$OUT/node-finder.txt"
          grep -q "Node.js: Installed" "$OUT/node-terminal.txt"

      - name: Import, inspect, configure and build through the wizard (npm ci → desktop:build → electron-builder --mac zip dmg --arm64)
        run: >
          dotnet tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll --electron --source "$OUT/src/presentation-studio"
          --arch arm64 --formats app,zip,dmg
          --expect-name "Presentation Studio" --expect-bundle-id com.oslosprint.presentationstudio --expect-version 0.1.0
          --output "$OUT/studio" --screenshots "$OUT/screens" --prefix electron

      - name: The .app exists; Apple's tools agree with HCG's verification (signature, arm64, Info.plist, zip, dmg)
        run: |
          APP="$(sed -n 1p "$OUT/studio/electron-app.txt")"
          echo "App: $APP"
          [ -d "$APP" ] && [[ "$APP" == *"/Presentation Studio.app" ]]
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|Signature|Format"
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundle(Name|Identifier|Executable|ShortVersionString)|LSMinimumSystemVersion|NSMicrophoneUsageDescription'
          [ "$(lipo -archs "$APP/Contents/MacOS/Presentation Studio")" = "arm64" ]
          dir="$(dirname "$APP")"
          hdiutil verify "$dir"/*.dmg
          unzip -tq "$dir"/*.zip
          # electron-builder wrote into HCG's build folder, not into the imported project.
          ls -d "$OUT/studio/hcg-data/workspaces"/*/source
          if ls -d "$OUT/studio/hcg-data/workspaces"/*/source/release 2>/dev/null; then echo "release/ was created in the imported source"; exit 1; fi

      - name: Launch through LaunchServices (as Finder does) — stays up, no crash report, no development server
        run: |
          for port in 5173 8787; do if nc -z 127.0.0.1 $port; then echo "port $port in use"; exit 1; fi; done
          bash "$OUT/Oslo-Sprint/.github/scripts/launch-check.sh" "$(sed -n 1p "$OUT/studio/electron-app.txt")" 10
          sleep 2
          if pgrep -fl "Presentation Studio.app"; then echo "processes left behind"; exit 1; fi

      - name: The project's own packaged-app end-to-end test, against the app HCG built
        working-directory: ${{ github.workspace }}/electron-out/Oslo-Sprint/presentation-studio
        env:
          STUDIO_SKIP_LIBREOFFICE: "1"
        run: |
          npm ci --no-audit --no-fund
          STUDIO_APP="$(sed -n 2p "$OUT/studio/electron-app.txt")" npm run test:desktop
          ls test-output/desktop

      - name: Window screenshot of the app HCG built
        continue-on-error: true
        env:
          WINDOW_ID: ${{ runner.temp }}/window-id
        run: |
          swiftc -O "$OUT/Oslo-Sprint/.github/scripts/window-id.swift" -o "$WINDOW_ID"
          bash "$OUT/Oslo-Sprint/.github/scripts/app-screenshot.sh" "$(sed -n 1p "$OUT/studio/electron-app.txt")" "$OUT/screens/electron-99-launched-app.png"

      - name: Screenshots (JPEG, base64 in the log)
        if: always()
        run: |
          shopt -s nullglob
          for f in "$OUT"/screens/*.png; do
            j="${f%.png}.jpg"
            sips -s format jpeg -s formatOptions 60 -Z 1400 "$f" --out "$j" >/dev/null
            echo "=====BEGIN-IMG $(basename "$j")====="
            base64 -i "$j" | tr -d '\n'; echo
            echo "=====END-IMG====="
          done

      - name: Upload Electron outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: electron-macos-outputs
          path: |
            ${{ github.workspace }}/electron-out/screens
            ${{ github.workspace }}/electron-out/studio/*.txt
            ${{ github.workspace }}/electron-out/studio/*.json
            ${{ github.workspace }}/electron-out/*.txt
            ${{ github.workspace }}/electron-out/Oslo-Sprint/presentation-studio/test-output/desktop
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hcg-executable-maker-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          HCG Executable Maker ${GITHUB_REF_NAME#v} — built and packaged by HCG Executable Maker itself on GitHub's macOS, Windows and Linux runners.

          | Platform | Download |
          |---|---|
          | macOS (Apple Silicon) | \`*-osx-arm64.dmg\` (or \`.app.zip\`) |
          | macOS (Intel) | \`*-osx-x64.dmg\` (or \`.app.zip\`) |
          | Windows x64 / ARM64 (installer) | \`*-win-x64-Setup.exe\` / \`*-win-arm64-Setup.exe\` |
          | Windows x64 / ARM64 (portable) | \`*-win-x64.zip\` / \`*-win-arm64.zip\` |
          | Linux (preview) | \`*-linux-x64.zip\` / \`*-linux-arm64.zip\` |

          **Unsigned pre-release** — HCG itself is not code-signed or notarized.
          - macOS first launch: \`xattr -cr "/Applications/HCG Executable Maker.app"\`, then right-click → Open.
          - Windows: SmartScreen → More info → Run anyway.

          Install the .NET 10 SDK to build projects with the app. See docs/TESTING.md. Verify downloads with SHA256SUMS.txt.
          EOF
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "HCG Executable Maker ${GITHUB_REF_NAME#v}" --notes-file notes.md --prerelease --verify-tag
          fi
